; ESPNES - NES emulator for ESP32 boards with FabGL's VGA and PS/2 wiring.
;
; Hardware: ESP32-PICO-D4 (4 MB flash on chip, no PSRAM, no SD card), VGA with 2 bits per
; channel, a PS/2 keyboard. Everything has to fit into the ~300 KB of internal RAM.
;
;   pio run -t upload       firmware, with every ROM in roms/ built in (tools/embed_roms.py)
;   pio device monitor      serial console (frame timing statistics)

[platformio]
default_envs = pico32

[env:pico32]
; Plain ESP-IDF (5.2), no Arduino core: the few Arduino APIs the code uses are in src/compat.*,
; the IDF's settings in sdkconfig.defaults. FabGL 1.0.9 was made for IDF 4.4; lib/FabGL has the
; changes for 5.x.
platform = espressif32@6.7.0
board = pico32
framework = espidf

board_build.partitions = partitions.csv
; SPIFFS (512 KB) is for save games and settings; the ROMs are in the firmware
board_build.filesystem = spiffs
extra_scripts = pre:tools/embed_roms.py
board_build.f_cpu = 240000000L
; the PICO-D4's on-chip flash runs at 80 MHz; it stays in DIO mode, which the board is defined with
board_build.f_flash = 80000000L
board_build.flash_mode = dio

build_flags = -O2 -Wno-error=format
build_unflags = -Os

; FabGL is vendored in lib/FabGL (see lib/FabGL/VENDORED.md); PlatformIO compiles lib/* itself
lib_ldf_mode = chain+

monitor_speed = 115200
upload_speed = 921600
