; ESPNES - NES emulator for ESP32 boards with FabGL's VGA and PS/2 wiring.
;
; Hardware: ESP32-PICO-D4 (4 MB flash on chip, no PSRAM, no SD card), VGA with 2 bits per
; channel, a PS/2 keyboard. Everything has to fit into the ~300 KB of internal RAM.
;
;   pio run -t upload       firmware
;   pio run -t uploadfs     the ROMs in roms/ into the SPIFFS partition
;   pio device monitor      serial console (frame timing statistics)

[platformio]
; roms/ is packed wholesale into the SPIFFS partition by "pio run -t uploadfs"
data_dir = roms
default_envs = pico32

[env:pico32]
; espressif32 6.7.0 == arduino-esp32 2.0.17 / ESP-IDF 4.4.7, as in ESPPC, which is known to build
; and run FabGL 1.0.9
platform = espressif32@6.7.0
board = pico32
framework = arduino

board_build.partitions = partitions.csv
board_build.filesystem = spiffs
board_build.f_cpu = 240000000L
; the PICO-D4's on-chip flash runs at 80 MHz; it stays in DIO mode, which the board is defined with
board_build.f_flash = 80000000L
board_build.flash_mode = dio

build_flags = -O2
build_unflags = -Os

; FabGL is vendored in lib/FabGL (see lib/FabGL/VENDORED.md); PlatformIO compiles lib/* itself
lib_ldf_mode = chain+

monitor_speed = 115200
upload_speed = 921600
